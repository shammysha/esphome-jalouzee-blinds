# The component targets ESP-IDF (framework: esp-idf) and the API level of
# the current ESPHome dev branch (ADC-oneshot driver, ESP-IDF >= 5.3).
# At the time this example was written (July 2026) the current ESPHome
# releases look like 2026.x.x — "2027.x" doesn't exist yet. Before flashing,
# check the CHANGELOG for your installed ESPHome version.
esphome:
  name: jalouzee-test
  min_version: "2025.9.0"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    # you can pin the ESP-IDF version explicitly if you want, e.g.:
    # version: 5.3.1

# Loading the external component.
# Option A — local folder (e.g. when developing next to the project):
external_components:
  - source:
      type: local
      path: components
    components: [jalouzee_blinds]

# Option B — from a git repository (uncomment and set your own repository):
# external_components:
#   - source: github://your-github-handle/esphome-jalouzee-blinds
#     components: [jalouzee_blinds]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
logger:

# --- Example 1: tilt angle from a Hall sensor (motor encoder) + MPU6050 as a backup ---
i2c:
  sda: GPIO21
  scl: GPIO22

sensor:
  - platform: mpu6050
    address: 0x68
    accel_x:
      name: "MPU6050 Accel X"
      id: acc_x
    update_interval: 100ms

cover:
  - platform: jalouzee_blinds
    id: blinds
    name: "Living Room Blinds"
    motor:
      in1: GPIO25
      in2: GPIO26
    encoder:
      # OPTION 1: Hall sensor on the motor (mutually exclusive with adc below)
      a: GPIO32
      b: GPIO33
      # OPTION 2 (commented out, mutually exclusive with a/b):
      # adc: GPIO34
    angle: acc_x
    position: auto   # auto | angle | encoder
    fault_timeout: 10s
