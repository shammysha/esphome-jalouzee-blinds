esphome:
  name: jalouzee-test
  friendly_name: Jalouzee Test


esp32:
  board: esp32dev
  framework:
    type: arduino



logger:
  level: DEBUG



api:


ota:


wifi:
  ssid: "YOUR_WIFI"
  password: "YOUR_PASSWORD"



external_components:
  - source:
      type: local
      path: components



# ----------------------------
# Тестовые GPIO мотора
# ----------------------------

switch:
  - platform: gpio
    pin: GPIO25
    id: test_open_pin
    internal: true


  - platform: gpio
    pin: GPIO26
    id: test_close_pin
    internal: true



# ----------------------------
# Тестовый датчик угла
#
# вместо реального датчика
# используем template
# ----------------------------

sensor:

  - platform: template
    id: test_angle
    name: "Test angle"
    update_interval: 1s

    lambda: |-

      static float angle = 0;

      if (id(move_test).state)
      {
        angle += 2;

        if(angle > 90)
          angle = 90;
      }

      return angle;



# ----------------------------
# Наш компонент
# ----------------------------

jalouzee_blinds:

  id: bedroom_blinds

  open_pin:
    number: GPIO25

  close_pin:
    number: GPIO26


  primary_sensor:
    id: test_angle


  stall_timeout: 10s



# ----------------------------
# Сам cover
# ----------------------------

# он создается самим компонентом



# ----------------------------
# Дополнительные сенсоры
# ----------------------------

sensor:

  - platform: jalouzee_blinds
    parent: bedroom_blinds
    type: angle
    name: "Blind angle"


  - platform: jalouzee_blinds
    parent: bedroom_blinds
    type: position
    name: "Blind position"



binary_sensor:

  - platform: jalouzee_blinds
    parent: bedroom_blinds
    type: fault
    name: "Blind fault"


  - platform: jalouzee_blinds
    parent: bedroom_blinds
    type: calibrated
    name: "Blind calibrated"



select:

  - platform: jalouzee_blinds
    parent: bedroom_blinds
    name: "Angle source"



button:

  - platform: jalouzee_blinds
    parent: bedroom_blinds
    name: "Start calibration"
    action: start_calibration


  - platform: jalouzee_blinds
    parent: bedroom_blinds
    name: "Save closed"
    action: save_closed


  - platform: jalouzee_blinds
    parent: bedroom_blinds
    name: "Save open"
    action: save_open


  - platform: jalouzee_blinds
    parent: bedroom_blinds
    name: "Clear fault"
    action: clear_fault



# ----------------------------
# Только для теста движения
# ----------------------------

switch:

  - platform: template
    id: move_test
    name: "Simulate angle movement"